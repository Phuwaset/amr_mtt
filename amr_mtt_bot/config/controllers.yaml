controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ur_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

# -------------------------------------------------------------------
# ส่วนควบคุมล้อ (Diff Drive) - ปรับความสมูทตรงนี้
# -------------------------------------------------------------------
diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["middle_left_wheel_joint"]  # เช็คแล้ว ชื่อนี้ตรงกับ macros.xacro
    right_wheel_names: ["middle_right_wheel_joint"] # เช็คแล้ว ชื่อนี้ตรงกับ macros.xacro
    wheel_separation: 0.436
    wheel_radius: 0.08

    use_stamped_vel: false

    # จุดสำคัญ: กำหนด Acceleration Limits เพื่อไม่ให้กระตุก
    mobile_base_config:
      linear:
        x:
          has_velocity_limits: true
          max_velocity: 1.0
          has_acceleration_limits: true
          max_acceleration: 0.35  # ค่านี้ยิ่งน้อย ยิ่งออกตัวนิ่มครับ
          has_deceleration_limits: true
          max_deceleration: -0.30  # ชะลอนุ่ม (ค่ายิ่งน้อย ยิ่งเบรกนิ่ม)
          has_jerk_limits: true
          max_jerk: 0.5  # จำกัดความกระชาก
      angular:
        z:
          has_velocity_limits: true
          max_velocity: 2.0
          has_acceleration_limits: true
          max_acceleration: 0.5
          has_deceleration_limits: true
          max_deceleration: -0.5  # ชะลอการหมุนนุ่ม
          has_jerk_limits: true
          max_jerk: 0.5

    # TF Parameters
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false
    publish_rate: 50.0

