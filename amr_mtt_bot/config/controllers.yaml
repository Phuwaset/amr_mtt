# -------------------------------------------------------------------
# ส่วนควบคุมแขน (UR5)
# -------------------------------------------------------------------
ur_arm_controller:
  ros__parameters:
    joints:
      - ur5_shoulder_pan_joint   # เติม ur5_
      - ur5_shoulder_lift_joint  # เติม ur5_
      - ur5_elbow_joint          # เติม ur5_
      - ur5_wrist_1_joint        # เติม ur5_
      - ur5_wrist_2_joint        # เติม ur5_
      - ur5_wrist_3_joint        # เติม ur5_
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

# -------------------------------------------------------------------
# ส่วนควบคุม Gripper (Robotiq 2F-85)
# -------------------------------------------------------------------
robotiq_gripper_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.05
    max_effort: 100.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0