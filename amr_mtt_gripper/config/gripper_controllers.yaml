# Gripper Controller Configuration for Robotiq 2F-85
# This spawns a GripperActionController to open/close the gripper

controller_manager:
  ros__parameters:
    update_rate: 100

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 100.0
    allow_stalling: false
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
